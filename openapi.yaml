openapi: 3.0.3
info:
  title: Cyber Storefront API
  version: "1.0.0"
  description: |
    **Cyber** ონლაინ მაღაზიის API: კატალოგი, ავტორიზაცია, კალათა, ჩექაუთი და პროფილი.

    ---

    # 🚀 სწრაფი დაწყება — სცადე აქვე, 4 ნაბიჯად

    ამ გვერდზე ყველა ენდპოინტის გატესტვა შეგიძლია, კოდის დაწერის გარეშე.

    ### ნაბიჯი 1 — შექმენი ანგარიში

    ჩამოდი `POST /auth/register`-მდე → დააჭირე **`Try it out`** (მარჯვნივ)
    → შეცვალე მონაცემები → **`Execute`**

    ```json
    { "name": "Test User", "email": "შენი@example.com", "password": "Password1" }
    ```

    ### ნაბიჯი 2 — დააკოპირე ტოკენი

    პასუხში (Response body) ნახავ:

    ```json
    {
      "user": { "id": "...", "name": "Test User", "email": "..." },
      "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOi..."
    }
    ```

    დააკოპირე **`accessToken`-ის მნიშვნელობა** — ბრჭყალების გარეშე.

    ### ნაბიჯი 3 — დააჭირე `Authorize` 🔓

    ამ გვერდის **ზედა მარჯვენა კუთხეში** არის ღილაკი **`Authorize`** (ბოქლომის ხატულით).

    1. დააჭირე
    2. ველში `Value` ჩასვი დაკოპირებული ტოკენი
       *(მხოლოდ ტოკენი — სიტყვა `Bearer` ჩაწერა არ გჭირდება, Swagger თავად დაამატებს)*
    3. **`Authorize`** → **`Close`**

    ბოქლომები 🔒 დაიკეტება — ესე იგი ავტორიზებული ხარ.

    ### ნაბიჯი 4 — სცადე დაცული ენდპოინტი

    ჩამოდი `GET /auth/me`-მდე → **`Try it out`** → **`Execute`**

    ✅ დაბრუნდება შენი მომხმარებლის მონაცემები.

    **სცადე საწინააღმდეგოც:** დააჭირე `Authorize` → **`Logout`** → ისევ გაუშვი
    `/auth/me`. მიიღებ `401 UNAUTHORIZED`. ზუსტად ასე მოიქცევა შენი აპლიკაციაც,
    თუ ტოკენს არ გააყოლებ.

    ---

    ## რა ხდება სინამდვილეში, როცა `Authorize`-ს აჭერ

    Swagger უბრალოდ ამატებს **ერთ ჰედერს** ყოველ მოთხოვნაში:

    ```http
    GET /api/auth/me HTTP/1.1
    Host: shop-api-kbe6.onrender.com
    Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ```

    იგივე შენს კოდში:

    ```js
    fetch(`${API}/auth/me`, {
      headers: { Authorization: `Bearer ${token}` },
    })
    ```

    ან `curl`-ით ტერმინალიდან:

    ```bash
    curl https://shop-api-kbe6.onrender.com/api/auth/me \
      -H "Authorization: Bearer <შენი-ტოკენი>"
    ```

    **სულ ეს არის.** ტოკენი არის ერთი ტექსტური ხაზი, რომელიც ჰედერში მიდის.

    ---

    სრული ტექნიკური აღწერა (როგორ მუშაობს JWT, პაროლის ჰეშირება, აღდგენის
    ფლოუ, დეპლოი): [ARCHITECTURE.md](https://github.com/khurtsilavabatu1/shop-api/blob/main/ARCHITECTURE.md)

    ---

    ## 1. როგორ დააკავშირო

    ```
    baseURL = https://shop-api-kbe6.onrender.com/api
    ```

    `.env` ფაილში:
    ```
    VITE_API_URL=https://shop-api-kbe6.onrender.com/api
    ```

    მოთხოვნის მაგალითი:
    ```js
    const res = await fetch(`${import.meta.env.VITE_API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    })
    const data = await res.json()

    if (!res.ok) throw data   // { message, code, errors? }
    ```

    > ⚠️ `fetch` **არ აგდებს შეცდომას** 4xx/5xx-ზე. ყოველთვის შეამოწმე `res.ok`.

    ---

    ## 2. ავტორიზაცია

    `register` და `login` აბრუნებენ `accessToken`-ს. ატარებ ჰედერში:

    ```
    Authorization: Bearer <accessToken>
    ```

    **ტოკენის ვადა — 30 წუთი.** ვადის გასვლისას მიიღებ:
    ```json
    { "message": "Access token expired", "code": "TOKEN_EXPIRED" }
    ```
    status `401`. ამ შემთხვევაში წაშალე ტოკენი და გადაამისამართე `/login`-ზე.

    სერვერი სესიებს **არ ინახავს** — ტოკენი თვითკმარია. ამიტომ `POST /auth/logout`
    მხოლოდ `204`-ს აბრუნებს: ტოკენის წაშლა კლიენტის პასუხისმგებლობაა.

    **Swagger-ში ტესტირებისთვის:** გაუშვი `login`, დააკოპირე `accessToken`,
    დააჭირე ზემოთ ღილაკს **Authorize** და ჩასვი.

    ---

    ## 3. შეცდომების ერთიანი ფორმატი

    ყველა შეცდომა ერთნაირად გამოიყურება:

    ```json
    { "message": "Invalid email or password", "code": "INVALID_CREDENTIALS" }
    ```

    ვალიდაციის შეცდომას (`422`) დამატებით აქვს `errors` — **პირდაპირ ველზე მისაბმელი**:

    ```json
    {
      "message": "Validation failed",
      "code": "VALIDATION_ERROR",
      "errors": {
        "email": "Enter a valid email address",
        "password": "Password must be at least 8 characters"
      }
    }
    ```

    ფრონტზე გამოყენება (React Hook Form):
    ```js
    if (res.status === 422) {
      Object.entries(data.errors).forEach(([field, message]) => {
        setError(field, { message })
      })
    }
    ```

    **გადაწყვეტილება მიიღე `code`-ზე, არა `message`-ზე.** ტექსტი შეიძლება შეიცვალოს,
    კოდი — არა.

    | code | status | როდის |
    |---|---|---|
    | `VALIDATION_ERROR` | 422 | ველები არავალიდურია (აქვს `errors`) |
    | `EMAIL_TAKEN` | 409 | ელფოსტა უკვე რეგისტრირებულია |
    | `INVALID_CREDENTIALS` | 401 | არასწორი ელფოსტა ან პაროლი |
    | `UNAUTHORIZED` | 401 | ტოკენი არ არის გადმოცემული |
    | `TOKEN_EXPIRED` | 401 | ტოკენს ვადა გაუვიდა → logout |
    | `INVALID_TOKEN` | 401 | ტოკენი დაზიანებული ან გაყალბებულია |
    | `INVALID_RESET_CODE` | 400 | აღდგენის კოდი არასწორი ან ვადაგასულია |
    | `TOO_MANY_ATTEMPTS` | 429 | 5+ არასწორი კოდი — მოითხოვე ახალი |
    | `RESET_TOKEN_USED` | 400 | resetToken უკვე გამოყენებულია |
    | `INVALID_CURRENT_PASSWORD` | 400 | პროფილის რედაქტირებისას მიმდინარე პაროლი არასწორია |
    | `PRODUCT_NOT_FOUND` | 404 | კალათაში დასამატებელი პროდუქტი არ არსებობს |
    | `CART_ITEM_NOT_FOUND` | 404 | კალათის პოზიცია არ მოიძებნა |
    | `OUT_OF_STOCK` / `INSUFFICIENT_STOCK` | 409 | მარაგი არ კმარა (აქვს `available` ან `items`) |
    | `CART_EMPTY` | 409 | შეკვეთა ცარიელი კალათით |
    | `CARD_DECLINED` | 402 | ბანკმა ბარათი უარყო (სატესტო ბარათი `4000 0000 0000 0002`) |
    | `INVALID_PAYMENT_CODE` | 400 | გადახდის კოდი არასწორი ან ვადაგასულია |
    | `RESEND_TOO_SOON` | 429 | ახალი კოდი 30 წამში ერთხელ (აქვს `retryAfterSeconds`) |
    | `ORDER_ALREADY_PAID` | 409 | შეკვეთა უკვე გადახდილია |
    | `ORDER_NOT_FOUND` | 404 | შეკვეთა არ არსებობს ან სხვისია |

    ---

    ## 4. პაროლის აღდგენა — სამი ნაბიჯი

    ```
    1. POST /auth/forgot-password    { email }                → 200 (ყოველთვის)
    2. POST /auth/verify-reset-code  { email, code }          → { resetToken }
    3. POST /auth/reset-password     { resetToken, password } → 200
    ```

    **ნაბიჯი 1 ყოველთვის აბრუნებს 200-ს**, არსებობს ანგარიში თუ არა.
    წინააღმდეგ შემთხვევაში ფორმა იქცევა ინსტრუმენტად, რომლითაც გაიგებ,
    ვის აქვს ანგარიში საიტზე (*account enumeration*).
    იმავე მიზეზით `/auth/login` ამბობს „არასწორი ელფოსტა **ან** პაროლი".

    - კოდი **6-ციფრიანია**, ვადა **15 წუთი**
    - **5 არასწორი მცდელობის** შემდეგ კოდი იბლოკება → `429`
    - `resetToken` **ერთჯერადია**, ვადა 10 წუთი

    ### ელფოსტა არ იგზავნება

    ეს სასწავლო API-ა. კოდი:
    1. იბეჭდება სერვერის ლოგში
    2. ბრუნდება პასუხის **`devCode`** ველში

    ანუ სრული ფლოუს ტესტირება ელფოსტის სერვისის გარეშე შეგიძლია.
    რეალურ პროდუქტში `devCode` არ იარსებებდა.

    ---

    ## 4.1 კალათა, ჩექაუთი და გადახდა 🔒

    ყველაფერი ამ ნაწილში **ტოკენს მოითხოვს** — კალათა სერვერზე ინახება და
    მომხმარებელზეა მიბმული, ამიტომ არც გვერდის განახლებისას იკარგება და არც სხვა მოწყობილობაზე.

    ```
    კალათა     GET /cart · POST /cart/items · PATCH /cart/items/:id · DELETE /cart/items/:id · DELETE /cart
    ჩექაუთი    GET /checkout                              → კალათა + ჯამები + პროფილიდან შევსებული მისამართი
    გადახდა 1  POST /orders  { shipping, card }           → { orderId, devCode? }  + კოდი ელფოსტაზე
    გადახდა 2  POST /orders/:id/confirm  { code }         → { order }  — კალათა სუფთავდება
    ისტორია    GET /orders · GET /orders/:id
    ```

    **გადახდა ვითომაა** — ფული არ ჩამოიჭრება და ბარათის სრული ნომერი არსად ინახება
    (შეკვეთაში მხოლოდ ბრენდი და ბოლო 4 ციფრი). სატესტო ბარათები, ნებისმიერი მომავალი ვადით (`MM/YY`) და CVC-ით:

    | ბარათი | შედეგი |
    |---|---|
    | `4242 4242 4242 4242` | ✅ წარმატება |
    | `4000 0000 0000 0002` | ❌ `402 CARD_DECLINED` |
    | Luhn-ის შემოწმებას ვერ გადის | `422`, `errors["card.number"]` |

    მიწოდება უფასოა **100 ₾-დან**, ქვემოთ — 5 ₾. კალათაში ფასი ყოველთვის მიმდინარეა;
    შეკვეთა ფასს „ყინავს" შექმნის მომენტში.

    ---

    ## 5. ⚠️ login ≠ register (განზრახი ასიმეტრია)

    | ენდპოინტი | პაროლის ვალიდაცია |
    |---|---|
    | `/auth/register` | მინ. 8 სიმბოლო, 1 ასო, 1 ციფრი |
    | `/auth/login` | **მხოლოდ სავალდებულო** |

    ეს შეცდომა არ არის. მომხმარებლის არსებული პაროლი შეიძლება ძველი პოლიტიკით
    იყოს შექმნილი — თუ შესვლაზე სირთულეს შეამოწმებ, **ის საკუთარ ანგარიშში
    ვეღარ შევა**, მიუხედავად იმისა, რომ პაროლი სწორია.

    იგივე წესი დაიცავი ფრონტზეც.

    ---

    ## 6. ტიპების გენერაცია

    ტიპები ხელით ნუ დაწერ — დააგენერირე ამ სპეციფიკაციიდან:

    ```bash
    npx openapi-typescript https://shop-api-kbe6.onrender.com/openapi.yaml \
      -o src/shared/api/schema.d.ts
    ```

    ასე API-ის ცვლილება **კომპილაციის დროს** გამოჩნდება, არა მომხმარებელთან.

    ---

    ## 7. სხვა შენიშვნები

    - **CORS** ღიაა — ნებისმიერი დომენიდან შეგიძლია მოთხოვნა
    - სერვისი უფასო ჰოსტინგზეა; პირველი მოთხოვნა იშვიათად შეიძლება იყოს ნელი
    - ბაზა საერთოა ყველა გუნდისთვის: **ელფოსტა უნიკალურია გლობალურად**.
      თუ `test@test.com` დაკავებულია, აიღე სხვა — ან დაამუშავე `409 EMAIL_TAKEN`

servers:
  - url: /api
    description: მიმდინარე სერვერი (ავტომატურად)
  - url: https://shop-api-kbe6.onrender.com/api
    description: პროდაქშენი
  - url: http://localhost:4000/api
    description: ლოკალური

tags:
  - name: Catalog
    description: კატეგორიები და პროდუქტები — ფილტრაცია, სორტირება, პაგინაცია, ძებნა
  - name: Auth
    description: რეგისტრაცია, შესვლა, პაროლის აღდგენა, პროფილის რედაქტირება
  - name: Cart
    description: 🔒 კალათა — დამატება, რაოდენობის შეცვლა, წაშლა
  - name: Checkout
    description: 🔒 ჩექაუთი, ვითომ გადახდა ელფოსტის კოდით, შეკვეთების ისტორია

paths:
  /health:
    get:
      tags: [Auth]
      summary: სერვისის სტატუსი
      responses:
        "200":
          description: OK


  /categories:
    get:
      tags: [Catalog]
      summary: კატეგორიების სია
      description: |
        მსუბუქი სია მთავარი გვერდისა და ნავიგაციისთვის: სახელი, აღწერა, ბანერი,
        პროდუქტების რაოდენობა.

        **ფილტრები აქ არ მოდის** — კატეგორიების სიაში ფილტრაცია არ ხდება,
        და 12 კატეგორიის ფილტრების გამოთვლა ზედმეტი დატვირთვა იქნებოდა.
        ფილტრები მოდის `/categories/{slug}`-ით, მაშინ, როცა მართლა გჭირდება.

        🔓 **ავტორიზაცია არ სჭირდება.**
      responses:
        "200": { description: OK }

  /categories/{slug}:
    get:
      tags: [Catalog]
      summary: ერთი კატეგორია + ფილტრების სრული სია
      description: |
        აბრუნებს კატეგორიას და **ერთ ერთიან `filters` მასივს**, რომელზეც ფრონტი
        გადის და ყველა ფილტრს ერთნაირად ხატავს — ბრენდი, ფასი და ატრიბუტები
        ერთსა და იმავე ფორმაშია.

        ```json
        { "key": "brand",    "label": "ბრენდი", "type": "checkbox",
          "options": [{ "value": "IKEA", "label": "IKEA" }] }

        { "key": "price",    "label": "ფასი",   "type": "range",
          "min": 126, "max": 4790, "unit": "₾" }

        { "key": "material", "label": "მასალა", "type": "checkbox",
          "options": [{ "value": "oak", "label": "მუხა" }] }
        ```

        ## value vs label

        - **`value`** — ინგლისური, URL-ში მიდის: `?material=oak`
        - **`label`** — ქართული, ინტერფეისში ჩანს: „მუხა"

        ასე URL სუფთა რჩება და ენის შეცვლა API-ს არ ეხება.

        `type`: `checkbox` (მრავლობითი) · `radio` (ერთი) · `color` (ფერის ნიმუშები) · `range` (სლაიდერი)

        🔓 **ავტორიზაცია არ სჭირდება.**
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string }, example: furniture }
      responses:
        "200": { description: OK }
        "404": { description: კატეგორია არ მოიძებნა }

  /products:
    get:
      tags: [Catalog]
      summary: პროდუქტების სია — ფილტრაცია, სორტირება, პაგინაცია, ძებნა
      description: |
        ## პასუხის ფორმა

        ```json
        { "items": [...], "total": 480, "page": 1, "limit": 12,
          "totalPages": 40, "sort": "newest" }
        ```

        ## ატრიბუტების ფილტრები

        გარდა ქვემოთ ჩამოთვლილი პარამეტრებისა, **ნებისმიერი ატრიბუტი** შეგიძლია
        გამოიყენო ფილტრად — გასაღები აიღე კატეგორიის `filters`-იდან:

        ```
        /products?category=smartphones&storage=256gb,512gb&color=black
        /products?category=clothing&size=m&season=winter&gender=women
        /products?category=furniture&type=sofa&material=oak
        ```

        მნიშვნელობები ინგლისურია (`value` ფილტრის განსაზღვრებიდან) — URL-ის
        დაშიფვრა არ გჭირდება.

        მრავალი მნიშვნელობა — მძიმით გამოყოფილი (`ან` ლოგიკა).
        სხვადასხვა ფილტრი ერთმანეთს ავსებს (`და` ლოგიკა).

        🔓 **ავტორიზაცია არ სჭირდება** — კატალოგის დათვალიერება საჯაროა.

        ## 🔑 რეკომენდაცია

        **ყველა ფილტრი URL-ში ჩაწერე** (`?category=...&sort=...&page=2`).
        მაშინ ბმული გასაზიარებელია, „უკან" ღილაკი მუშაობს და გვერდის განახლება
        არაფერს კარგავს.
      parameters:
        - { name: category, in: query, schema: { type: string }, description: "კატეგორიის slug. მძიმით — რამდენიმე", example: smartphones }
        - { name: brand, in: query, schema: { type: string }, description: "ბრენდი. მძიმით — რამდენიმე", example: Apple }
        - { name: q, in: query, schema: { type: string }, description: "ძებნა სახელში, ბრენდსა და აღწერაში" }
        - { name: minPrice, in: query, schema: { type: number }, example: 500 }
        - { name: maxPrice, in: query, schema: { type: number }, example: 3000 }
        - { name: minRating, in: query, schema: { type: number }, description: "მინიმალური რეიტინგი (1–5)", example: 4 }
        - { name: inStock, in: query, schema: { type: boolean }, description: "მხოლოდ მარაგში არსებული" }
        - { name: onSale, in: query, schema: { type: boolean }, description: "მხოლოდ ფასდაკლებული" }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, price-asc, price-desc, rating-desc, popular, title-asc]
            default: newest
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 60 } }
      responses:
        "200": { description: OK }

  /products/{slug}:
    get:
      tags: [Catalog]
      summary: ერთი პროდუქტი + მსგავსი პროდუქტები
      description: |
        აბრუნებს სრულ პროდუქტს: **5 სურათი**, `specs` (კატეგორიისთვის შესაბამისი
        მახასიათებლები), `attributes`, გარანტია, მარაგი, და `related` —
        8 მსგავსი პროდუქტი იმავე კატეგორიიდან.

        `specs` არის `{ "მახასიათებელი": "მნიშვნელობა" }` — **ნებისმიერი კატეგორიისთვის
        ერთი და იგივე ფორმა**. ცხრილი ერთხელ იწერება და ყველგან მუშაობს.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { description: პროდუქტი არ მოიძებნა }

  /auth/register:
    post:
      tags: [Auth]
      summary: რეგისტრაცია
      description: |
        👉 **პასუხიდან დააკოპირე `accessToken`** და ჩასვი ზემოთ ღილაკში `Authorize` 🔓 —
        ამის შემდეგ დაცული ენდპოინტების ტესტირებას შეძლებ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, example: "Nino Beridze" }
                email: { type: string, format: email, example: "nino@example.com" }
                password:
                  type: string
                  minLength: 8
                  description: მინ. 8 სიმბოლო, მინიმუმ 1 ასო და 1 ციფრი
                  example: "Password1"
      responses:
        "201":
          description: ანგარიში შეიქმნა
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409":
          description: ელფოსტა უკვე დაკავებულია (`EMAIL_TAKEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "422":
          $ref: "#/components/responses/Validation"

  /auth/login:
    post:
      tags: [Auth]
      summary: შესვლა
      description: |
        👉 **პასუხიდან დააკოპირე `accessToken`** და ჩასვი ზემოთ ღილაკში `Authorize` 🔓

        ⚠️ შესვლაზე პაროლის სირთულე **არ მოწმდება** — მხოლოდ სავალდებულოობა.
        მომხმარებლის არსებული პაროლი შეიძლება ძველი პოლიტიკით იყოს შექმნილი.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "nino@example.com" }
                password: { type: string, example: "Password1" }
      responses:
        "200":
          description: შესვლა წარმატებულია
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: არასწორი ელფოსტა ან პაროლი (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/Validation"

  /auth/me:
    get:
      tags: [Auth]
      summary: მიმდინარე მომხმარებელი
      description: |
        🔒 **საჭიროებს ტოკენს.** ჯერ გაიარე `Authorize` (იხ. სწრაფი დაწყება ზემოთ),
        თორემ მიიღებ `401 UNAUTHORIZED`.

        **რისთვის სჭირდება ფრონტენდს:** აპლიკაციის გაშვებისას ეს ერთი მოთხოვნა
        ერთდროულად პასუხობს ორ კითხვას — *„ჩემი ტოკენი ჯერ კიდევ ვარგა?"* და
        *„ვინ არის შესული მომხმარებელი?"*

        - `200` → ტოკენი ვალიდურია, აი მომხმარებელი
        - `401` → წაშალე ტოკენი `localStorage`-დან და გადაამისამართე `/login`-ზე
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: ტოკენი არ არის, არასწორია ან ვადაგასულია (`TOKEN_EXPIRED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [Auth]
      summary: პროფილის რედაქტირება
      description: |
        🔒 **საჭიროებს ტოკენს.** გაგზავნე მხოლოდ ის ველები, რომლის შეცვლაც გინდა.

        **`currentPassword` ყოველთვის სავალდებულოა** — ნებისმიერ ცვლილებამდე სერვერი
        ამოწმებს მიმდინარე პაროლს. არასწორზე: `400 INVALID_CURRENT_PASSWORD` (და არა `401`,
        რომ ფრონტენდმა მომხმარებელი სისტემიდან არ გააგდოს).

        - `newPassword` — ახალი პაროლი (იგივე წესები, რაც რეგისტრაციაზე)
        - `phone`, `city`, `address` — `""` ან `null` ასუფთავებს ველს
        - ეს ველები ჩექაუთზე მისამართს ავტომატურად ავსებს (`GET /checkout`)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, example: "Password1" }
                name: { type: string, minLength: 2, example: "Nino Beridze" }
                email: { type: string, format: email, example: "nino.new@example.com" }
                newPassword: { type: string, minLength: 8, example: "NewPass123" }
                phone: { type: string, nullable: true, example: "+995 555 12 34 56" }
                city: { type: string, nullable: true, example: "Tbilisi" }
                address: { type: string, nullable: true, example: "Rustaveli Ave 12, apt 5" }
      responses:
        "200":
          description: პროფილი განახლდა
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: მიმდინარე პაროლი არასწორია (`INVALID_CURRENT_PASSWORD`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: ახალი ელფოსტა სხვა ანგარიშზეა (`EMAIL_TAKEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "422":
          $ref: "#/components/responses/Validation"

  /auth/logout:
    post:
      tags: [Auth]
      summary: გასვლა
      description: |
        აბრუნებს `204`-ს და **სერვერზე არაფერს აკეთებს**.

        ტოკენი stateless-ია — სერვერს სესია არ უნახავს, ამიტომ წასაშლელი არაფერი აქვს.
        **გამოსვლა = ტოკენის წაშლა კლიენტზე:**

        ```js
        localStorage.removeItem('accessToken')
        ```
      responses:
        "204": { description: OK }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "აღდგენა — ნაბიჯი 1: კოდის მოთხოვნა"
      description: |
        👉 **პასუხიდან დააკოპირე `devCode`** — ის დაგჭირდება შემდეგ ნაბიჯზე
        (`/auth/verify-reset-code`).

        **ყოველთვის აბრუნებს 200-ს**, არსებობს ანგარიში თუ არა — თორემ ფორმა
        იქცევა ინსტრუმენტად, რომლითაც გაიგებ, ვის აქვს ანგარიში საიტზე.

        კოდი 6-ციფრიანია, ვადა 15 წუთი. ელფოსტა არ იგზავნება: სასწავლო რეჟიმში
        კოდი ბრუნდება `devCode`-ში.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: "nino@example.com" }
      responses:
        "200":
          description: ნეიტრალური პასუხი
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "If an account exists for this email, we have sent a 6-digit code." }
                  expiresInMinutes: { type: integer, example: 15 }
                  devCode: { type: string, example: "483920", description: "მხოლოდ სასწავლო რეჟიმში" }
        "422":
          $ref: "#/components/responses/Validation"

  /auth/verify-reset-code:
    post:
      tags: [Auth]
      summary: "აღდგენა — ნაბიჯი 2: კოდის შემოწმება"
      description: |
        👉 **პასუხიდან დააკოპირე `resetToken`** — ის დაგჭირდება ბოლო ნაბიჯზე
        (`/auth/reset-password`).

        ⚠️ ეს **არ არის** `accessToken`. `Authorize`-ში მისი ჩასმა არ გჭირდება —
        ის პირდაპირ სხეულში (body) მიდის.

        `resetToken`-ის ვადა 10 წუთია და **ერთჯერადია**.
        5 არასწორი მცდელობის შემდეგ კოდი იბლოკება (`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, example: "nino@example.com" }
                code: { type: string, pattern: "^\\d{6}$", example: "483920" }
      responses:
        "200":
          description: კოდი სწორია
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken: { type: string }
        "400":
          description: კოდი არასწორია ან ვადაგასულია (`INVALID_RESET_CODE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "429":
          description: ძალიან ბევრი მცდელობა (`TOO_MANY_ATTEMPTS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/Validation"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "აღდგენა — ნაბიჯი 3: ახალი პაროლი"
      description: |
        ჩასვი წინა ნაბიჯზე მიღებული `resetToken` და ახალი პაროლი.

        წარმატების შემდეგ სცადე `POST /auth/login` **ახალი** პაროლით —
        და დარწმუნდი, რომ ძველი აღარ მუშაობს.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, password]
              properties:
                resetToken: { type: string }
                password: { type: string, minLength: 8, example: "NewPassword1" }
      responses:
        "200":
          description: პაროლი შეიცვალა
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: ტოკენი არასწორია, ვადაგასულია ან უკვე გამოყენებულია
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/Validation"

  /cart:
    get:
      tags: [Cart]
      summary: ჩემი კალათა
      description: 🔒 აბრუნებს პოზიციებს, საერთო რაოდენობას (`totalQty`) და ჯამს (`subtotal`).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Cart]
      summary: კალათის გასუფთავება
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cart/items:
    post:
      tags: [Cart]
      summary: კალათაში დამატება
      description: |
        🔒 თუ პროდუქტი კალათაში უკვე არის, **რაოდენობა ემატება** (ახალი პოზიცია არ იქმნება)
        — პასუხი მაშინ `200`-ია, ახალზე `201`.

        ყველა ცვლილება აბრუნებს **მთლიან განახლებულ კალათას** — ცალკე `GET /cart` არ გჭირდება.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, description: "პროდუქტის `id` (არა slug)" }
                qty: { type: integer, minimum: 1, maximum: 99, default: 1 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "201": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: პროდუქტი არ არსებობს (`PRODUCT_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/NotEnoughStock" }
        "422":
          $ref: "#/components/responses/Validation"

  /cart/items/{id}:
    parameters:
      - { name: id, in: path, required: true, description: "კალათის პოზიციის `id` (`items[].id`, არა productId)", schema: { type: string } }
    patch:
      tags: [Cart]
      summary: რაოდენობის შეცვლა (+ / −)
      description: |
        🔒 აყენებს **ზუსტ** რაოდენობას. სტეპერზე `+` → `qty + 1`, `−` → `qty - 1`.
        `0` დაუშვებელია — პოზიციის მოსაშორებლად გამოიყენე `DELETE`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 1, maximum: 99, example: 2 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CartItemNotFound" }
        "409": { $ref: "#/components/responses/NotEnoughStock" }
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [Cart]
      summary: პოზიციის წაშლა
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CartItemNotFound" }

  /checkout:
    get:
      tags: [Checkout]
      summary: ჩექაუთის გვერდის მონაცემები
      description: |
        🔒 **ჩექაუთის გვერდი ავტორიზაციის გარეშე არ იხსნება** — `401`-ზე გადაამისამართე `/login`-ზე
        და შესვლის შემდეგ დააბრუნე ჩექაუთზე.

        აბრუნებს კალათას, ჯამებს მიწოდების ჩათვლით და `shipping`-ს — პროფილიდან
        წინასწარ შევსებულ მისამართს ფორმისთვის. ცარიელ კალათაზე `items: []`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders:
    post:
      tags: [Checkout]
      summary: "გადახდა — ნაბიჯი 1: შეკვეთა + ბარათი → კოდი ელფოსტაზე"
      description: |
        🔒 შეკვეთა იქმნება **სერვერის კალათიდან** (პროდუქტების სიას თავად არ აგზავნი) სტატუსით
        `pending_payment`, ხოლო ელფოსტაზე მიდის 6-ციფრიანი კოდი (ვადა **10 წუთი**).

        კოდი, როცა `DEV_EXPOSE_RESET_CODE=true`, ბრუნდება `devCode`-შიც.

        სატესტო ბარათები: `4242 4242 4242 4242` ✅, `4000 0000 0000 0002` → `402 CARD_DECLINED`.
        ვალიდაციის შეცდომები ჩადგმულ ველებზე: `errors["card.number"]`, `errors["shipping.phone"]`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping, card]
              properties:
                shipping: { $ref: "#/components/schemas/Shipping" }
                card:
                  type: object
                  required: [number, holder, expiry, cvc]
                  properties:
                    number: { type: string, example: "4242 4242 4242 4242" }
                    holder: { type: string, example: "NINO BERIDZE" }
                    expiry: { type: string, pattern: "^(0[1-9]|1[0-2])/\\d{2}$", example: "12/29" }
                    cvc: { type: string, example: "123" }
      responses:
        "201":
          description: შეკვეთა შეიქმნა, კოდი გაიგზავნა
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  status: { type: string, example: pending_payment }
                  total: { type: number, example: 245.5 }
                  currency: { type: string, example: GEL }
                  message: { type: string }
                  expiresInMinutes: { type: integer, example: 10 }
                  devCode: { type: string, example: "483920", description: "მხოლოდ DEV_EXPOSE_RESET_CODE=true-ზე" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: ბარათი უარყოფილია (`CARD_DECLINED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: კალათა ცარიელია (`CART_EMPTY`) ან მარაგი არ კმარა (`INSUFFICIENT_STOCK`, `items[]`-ით)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/Validation"
    get:
      tags: [Checkout]
      summary: ჩემი შეკვეთები
      description: 🔒 შეკვეთების ისტორია, ახალი პირველი.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Checkout]
      summary: "გადახდა — ნაბიჯი 2: კოდის დადასტურება → გადახდა"
      description: |
        🔒 სწორ კოდზე შეკვეთა ხდება `paid`, მარაგი ჩამოიჭრება და **კალათა სუფთავდება**.
        5 არასწორი მცდელობის შემდეგ — `429`, მოითხოვე ახალი კოდი.

        თუ კოდის მოსვლამდე ვიღაცამ ბოლო ნივთი იყიდა — `409 INSUFFICIENT_STOCK`, არაფერი ჩამოიჭრება.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^\\d{6}$", example: "483920" }
      responses:
        "200":
          description: გადახდილია
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "400":
          description: კოდი არასწორი ან ვადაგასულია (`INVALID_PAYMENT_CODE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409":
          description: უკვე გადახდილია (`ORDER_ALREADY_PAID`) ან მარაგი აღარ კმარა (`INSUFFICIENT_STOCK`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          description: ძალიან ბევრი მცდელობა (`TOO_MANY_ATTEMPTS`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/resend-code:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Checkout]
      summary: კოდის ხელახლა გაგზავნა
      description: 🔒 ახალი კოდი, ახალი 10 წუთი, მცდელობები ნულდება. **30 წამში ერთხელ.**
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: გაიგზავნა
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  expiresInMinutes: { type: integer, example: 10 }
                  devCode: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrderNotFound" }
        "409":
          description: შეკვეთა უკვე გადახდილია (`ORDER_ALREADY_PAID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: ძალიან ადრეა (`RESEND_TOO_SOON`, `retryAfterSeconds`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Checkout]
      summary: ერთი შეკვეთა
      description: 🔒 მხოლოდ საკუთარი — სხვისი შეკვეთის id-ზე `404`. შეკვეთის დადასტურების გვერდისთვის.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrderNotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: ტოკენი არ არის, არასწორია ან ვადაგასულია (`UNAUTHORIZED` / `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Cart:
      description: განახლებული კალათა
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cart" }
    NotEnoughStock:
      description: მარაგი არ კმარა (`OUT_OF_STOCK` / `INSUFFICIENT_STOCK`); `available` — რამდენია მარაგში
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: "Only 3 left in stock" }
              code: { type: string, example: INSUFFICIENT_STOCK }
              available: { type: integer, example: 3 }
    CartItemNotFound:
      description: პოზიცია არ მოიძებნა (`CART_ITEM_NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OrderNotFound:
      description: შეკვეთა არ მოიძებნა (`ORDER_NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: ვალიდაციის შეცდომა (`VALIDATION_ERROR`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

  schemas:
    User:
      type: object
      properties:
        id: { type: string, example: "clx8f2k9a0000..." }
        name: { type: string, example: "Nino Beridze" }
        email: { type: string, example: "nino@example.com" }
        phone: { type: string, nullable: true, example: "+995 555 12 34 56" }
        city: { type: string, nullable: true, example: "Tbilisi" }
        address: { type: string, nullable: true, example: "Rustaveli Ave 12, apt 5" }
        createdAt: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        id: { type: string, description: "პოზიციის id — PATCH/DELETE-ისთვის" }
        productId: { type: string }
        qty: { type: integer, example: 2 }
        lineTotal: { type: number, example: 199.98 }
        product:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            title: { type: string }
            brand: { type: string }
            image: { type: string }
            price: { type: number, example: 99.99 }
            oldPrice: { type: number, nullable: true }
            currency: { type: string, example: GEL }
            stock: { type: integer, example: 12 }
            inStock: { type: boolean }

    Cart:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        totalQty: { type: integer, example: 3, description: "ჰედერის კალათის ბეჯისთვის" }
        subtotal: { type: number, example: 299.97 }
        currency: { type: string, example: GEL }

    Shipping:
      type: object
      required: [fullName, phone, city, address]
      properties:
        fullName: { type: string, example: "Nino Beridze" }
        phone: { type: string, example: "+995 555 12 34 56" }
        city: { type: string, example: "Tbilisi" }
        address: { type: string, example: "Rustaveli Ave 12, apt 5" }

    CheckoutSummary:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        totalQty: { type: integer }
        subtotal: { type: number, example: 89.5 }
        shippingFee: { type: number, example: 5 }
        total: { type: number, example: 94.5 }
        currency: { type: string, example: GEL }
        freeShippingFrom: { type: number, example: 100 }
        shipping: { $ref: "#/components/schemas/Shipping" }

    Order:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending_payment, paid] }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, nullable: true, description: "null, თუ პროდუქტი კატალოგიდან წაიშალა" }
              slug: { type: string }
              title: { type: string }
              image: { type: string }
              price: { type: number, description: "ფასი შეკვეთის მომენტში" }
              qty: { type: integer }
              lineTotal: { type: number }
        subtotal: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        currency: { type: string, example: GEL }
        shipping: { $ref: "#/components/schemas/Shipping" }
        payment:
          type: object
          properties:
            brand: { type: string, example: visa }
            last4: { type: string, example: "4242" }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken:
          type: string
          description: "ატარე ჰედერში: Authorization: Bearer <accessToken>"

    Error:
      type: object
      properties:
        message: { type: string, example: "Invalid email or password" }
        code: { type: string, example: "INVALID_CREDENTIALS" }

    ValidationError:
      type: object
      properties:
        message: { type: string, example: "Validation failed" }
        code: { type: string, example: "VALIDATION_ERROR" }
        errors:
          type: object
          additionalProperties: { type: string }
          example: { email: "Enter a valid email address", password: "Password must be at least 8 characters" }
